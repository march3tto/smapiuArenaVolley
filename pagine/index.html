<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Smapiù Arena Volley</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header>
    <div class="contenuto">
      <p>A.S.D. Arena Volley Team</p>
      <h1>App Smapiù Arena Volley</h1>
    </div>
  </header>
  <main>
    <!-- Site URL di Supabase Auth: dopo il link di conferma email si arriva qui con ?code=... oppure ?error_description=... -->
    <section id="conferma" hidden>
      <h2 id="conferma-titolo"></h2>
      <p id="conferma-testo"></p>
    </section>
    <section>
      <h2>Documenti</h2>
      <ul>
        <li><a href="privacy/">Informativa privacy</a></li>
        <li><a href="elimina-account/">Come eliminare l'account</a></li>
      </ul>
    </section>
    <section>
      <h2>Assistenza</h2>
      <p>Per problemi con l'app o con il tuo account scrivi a
        <a href="mailto:info@arenavolleyteam.it">info@arenavolleyteam.it</a>.</p>
    </section>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
      var errore = q.get('error_description');
      if (!errore && !q.get('code') && !q.get('access_token')) return;
      document.getElementById('conferma').hidden = false;
      document.getElementById('conferma-titolo').textContent = errore ? 'Link non valido' : 'Email confermata';
      document.getElementById('conferma-testo').textContent = errore
        ? 'Il link è scaduto o è già stato usato. Apri l’app e accedi: se serve, richiedi un nuovo link.'
        : 'Grazie! Ora torna nell’app Smapiù Arena Volley e accedi con la tua email e la password.';
      // il codice nell'indirizzo non serve qui: si toglie dalla barra degli indirizzi
      history.replaceState(null, '', location.pathname);
    })();
  </script>
  <footer>Contatti: <a href="mailto:info@arenavolleyteam.it">info@arenavolleyteam.it</a> · <a href="https://arenavolleyteam.it">arenavolleyteam.it</a></footer>
</body>
</html>
